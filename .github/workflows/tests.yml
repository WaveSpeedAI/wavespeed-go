name: tests

# Runs on pull requests as well as main. go-packages.yml also runs the suite,
# but only after a merge, so a failing test could not be caught before landing.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: true
      - name: Vet
        run: go vet ./...
      # -race is the point: the suite spins up httptest servers whose handlers
      # touch state the assertions read. No API key is set, so anything needing
      # live credentials skips.
      - name: Test
        run: go test -race ./...
